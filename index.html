<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 动态视频背景 -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="bg.mp4" type="video/mp4">
        <!-- 如果浏览器不支持视频，则什么都不显示，CSS里的图片兜底会生效 -->
    </video>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-logo">There's a 哈基米 on your lawn</div>
        <ul class="nav-links">
            <li><a href="#home">首页</a></li>
            <li><a href="#works">作品</a></li>
            <li><a href="#notes">笔记</a></li>
            <li><a href="#guestbook">留言</a></li>
            <li><a href="games.html">🎮 游戏厅</a></li>
        </ul>
        <div class="nav-toggle" id="navToggle">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <!-- 首页 -->
    <section id="home" class="hero">
        <div class="hero-particles" id="particles"></div>
        <div class="hero-content">
            <div class="avatar" id="avatar">
                <img src="https://api.yimian.xyz/img?type=head" alt="头像">
            </div>
            <h1 id="myName">你的名字</h1>
            <p class="bio" id="myBio">在这里写一句话介绍自己</p>
            <div class="social-links" id="socialLinks"></div>
        </div>
    </section>

    <!-- 作品 -->
    <section id="works" class="section">
        <h2 class="section-title">作品</h2>
        <div class="card-grid" id="worksGrid">
            <div class="empty-hint">还没有作品，打开 admin.html 添加</div>
        </div>
    </section>

    <!-- 笔记 -->
    <section id="notes" class="section">
        <h2 class="section-title">笔记</h2>
        <div class="card-grid" id="notesGrid">
            <div class="empty-hint">还没有笔记，打开 admin.html 添加</div>
        </div>
    </section>

    <!-- 留言板（弹幕效果） -->
    <section id="guestbook" class="section" style="padding-bottom: 20px;">
        <h2 class="section-title">留言墙</h2>
        
        <!-- 弹幕显示区域 -->
        <div id="danmaku-container" style="position: relative; width: 100%; height: 300px; background: rgba(0,0,0,0.3); border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);">
            <div class="empty-hint" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">正在加载留言...</div>
        </div>
        
        <!-- 留言输入区 -->
        <div style="display: flex; gap: 10px; max-width: 600px; margin: 0 auto;">
            <input type="text" id="danmakuInput" placeholder="写下你的留言吧..." style="flex: 1; padding: 12px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; outline: none;">
            <button onclick="sendDanmaku()" style="padding: 0 24px; border-radius: 30px; border: none; background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s;">发送</button>
        </div>
    </section>

    <footer class="footer">
        <p id="footerText">© 2026 MySpace</p>
    </footer>

    <!-- 引入数据配置和主逻辑 -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
