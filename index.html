<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 动态视频背景 -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="bg.mp4" type="video/mp4">
        <!-- 如果浏览器不支持视频，则什么都不显示，CSS里的图片兜底会生效 -->
    </video>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-logo">There's a 哈基米 on your lawn</div>
        <ul class="nav-links">
            <li><a href="#home">首页</a></li>
            <li><a href="#works">作品</a></li>
            <li><a href="#notes">笔记</a></li>
        </ul>
        <div class="nav-toggle" id="navToggle">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <!-- 首页 -->
    <section id="home" class="hero">
        <div class="hero-particles" id="particles"></div>
        <div class="hero-content">
            <div class="avatar" id="avatar">
                <img src="https://api.yimian.xyz/img?type=head" alt="头像">
            </div>
            <h1 id="myName">你的名字</h1>
            <p class="bio" id="myBio">在这里写一句话介绍自己</p>
            <div class="social-links" id="socialLinks"></div>
        </div>
    </section>

    <!-- 作品 -->
    <section id="works" class="section">
        <h2 class="section-title">作品</h2>
        <div class="card-grid" id="worksGrid">
            <div class="empty-hint">还没有作品，打开 admin.html 添加</div>
        </div>
    </section>

    <!-- 笔记 -->
    <section id="notes" class="section">
        <h2 class="section-title">笔记</h2>
        <div class="card-grid" id="notesGrid">
            <div class="empty-hint">还没有笔记，打开 admin.html 添加</div>
        </div>
    </section>

    <footer class="footer">
        <p id="footerText">© 2026 MySpace</p>
    </footer>

    <!-- 引入数据配置和主逻辑 -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
