<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 - 哈基米游戏厅</title>
    <style>
        :root { --bg-dark: #121212; --accent: #4ecdc4; }
        body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--bg-dark); color: #fff; font-family: sans-serif; }
        .nav { position: absolute; top: 20px; left: 20px; }
        .nav a { color: #fff; text-decoration: none; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; }
        .nav a:hover { background: rgba(255,255,255,0.1); }
        
        canvas { border: 2px solid var(--accent); background: #000; box-shadow: 0 0 20px rgba(78, 205, 196, 0.2); }
        .score-board { display: flex; justify-content: space-between; width: 400px; margin-bottom: 10px; font-size: 1.2rem; }
        .btn { margin-top: 20px; padding: 10px 30px; font-size: 1.1rem; background: var(--accent); color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:hover { opacity: 0.8; }
        .controls { display: none; margin-top: 20px; gap: 10px; }
        .ctrl-btn { width: 60px; height: 60px; font-size: 24px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; }
        @media (max-width: 768px) {
            canvas { width: 300px; height: 300px; }
            .score-board { width: 300px; }
            .controls { display: flex; flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="nav"><a href="games.html">← 返回游戏厅</a></div>
    
    <div class="score-board">
        <span>得分: <span id="score">0</span></span>
        <span>最高: <span id="highScore">0</span></span>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <button class="btn" id="startBtn" onclick="startGame()">开始游戏</button>

    <!-- 移动端虚拟按键 -->
    <div class="controls">
        <button class="ctrl-btn" onclick="setDir(0, -1)">上</button>
        <div style="display:flex; gap:60px;">
            <button class="ctrl-btn" onclick="setDir(-1, 0)">左</button>
            <button class="ctrl-btn" onclick="setDir(1, 0)">右</button>
        </div>
        <button class="ctrl-btn" onclick="setDir(0, 1)">下</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        let snake = [];
        let food = {};
        let dx = 0, dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_highscore') || 0;
        let gameLoop;
        let isPlaying = false;

        document.getElementById('highScore').textContent = highScore;

        function init() {
            snake = [{x: 200, y: 200}];
            dx = gridSize; dy = 0;
            score = 0;
            updateScore();
            spawnFood();
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
            food.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
            // 确保食物不在蛇身上
            if (snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
        }

        function update() {
            if (!isPlaying) return;
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // 撞墙或撞自己
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || 
                snake.some(s => s.x === head.x && s.y === head.y)) {
                return gameOver();
            }
            
            snake.unshift(head);
            
            // 吃食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                spawnFood();
            } else {
                snake.pop();
            }
            
            draw();
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 画食物
            ctx.fillStyle = '#ff758f';
            ctx.beginPath();
            ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
            ctx.fill();
            
            // 画蛇
            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#4ecdc4' : '#3bc9db';
                ctx.fillRect(s.x + 1, s.y + 1, gridSize - 2, gridSize - 2);
            });
        }

        function startGame() {
            if (isPlaying) return;
            document.getElementById('startBtn').style.display = 'none';
            init();
            isPlaying = true;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 120);
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameLoop);
            document.getElementById('startBtn').textContent = '重新开始';
            document.getElementById('startBtn').style.display = 'block';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_highscore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束', canvas.width/2, canvas.height/2);
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        function setDir(newDx, newDy) {
            if ((dx !== 0 && newDx !== 0) || (dy !== 0 && newDy !== 0)) return; // 不能直接掉头
            dx = newDx * gridSize;
            dy = newDy * gridSize;
        }

        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            switch(e.key) {
                case 'ArrowUp': case 'w': setDir(0, -1); break;
                case 'ArrowDown': case 's': setDir(0, 1); break;
                case 'ArrowLeft': case 'a': setDir(-1, 0); break;
                case 'ArrowRight': case 'd': setDir(1, 0); break;
            }
        });
        
        init();
        draw();
    </script>
</body>
</html>
