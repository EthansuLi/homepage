<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - 哈基米游戏厅</title>
    <style>
        :root { --bg-dark: #121212; --accent: #3bc9db; }
        body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--bg-dark); color: #fff; font-family: sans-serif; }
        .nav { position: absolute; top: 20px; left: 20px; }
        .nav a { color: #fff; text-decoration: none; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; }
        .nav a:hover { background: rgba(255,255,255,0.1); }
        
        .header { margin-bottom: 20px; font-size: 1.2rem; display: flex; gap: 20px; align-items: center;}
        #board { background: #edc785; border: 4px solid #8b5a2b; position: relative; cursor: crosshair; }
        .cell { position: absolute; width: 30px; height: 30px; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 2px 2px 4px rgba(0,0,0,0.4); display: none; }
        .cell.black { background: radial-gradient(circle at 10px 10px, #666, #000); display: block; }
        .cell.white { background: radial-gradient(circle at 10px 10px, #fff, #ccc); display: block; }
        
        .btn { padding: 8px 24px; font-size: 1rem; background: var(--accent); color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;}
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="nav"><a href="games.html">← 返回游戏厅</a></div>
    
    <div class="header">
        <span id="status">玩家 (黑) 回合</span>
        <button class="btn" onclick="init()">重新开始</button>
    </div>
    
    <div id="board" style="width: 450px; height: 450px;">
        <canvas id="gridCanvas" width="450" height="450" style="position:absolute; top:0; left:0; pointer-events:none;"></canvas>
        <div id="pieces"></div>
    </div>

    <script>
        const size = 15;
        const cellSize = 30;
        let board = [];
        let isPlayerTurn = true;
        let isGameOver = false;

        function drawGrid() {
            const canvas = document.getElementById('gridCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#8b5a2b';
            for(let i=0; i<size; i++) {
                ctx.moveTo(15 + i*cellSize, 15); ctx.lineTo(15 + i*cellSize, 435);
                ctx.moveTo(15, 15 + i*cellSize); ctx.lineTo(435, 15 + i*cellSize);
            }
            ctx.stroke();
        }

        function init() {
            board = Array(size).fill(0).map(()=>Array(size).fill(0));
            document.getElementById('pieces').innerHTML = '';
            isPlayerTurn = true;
            isGameOver = false;
            document.getElementById('status').textContent = '玩家 (黑) 回合';
            drawGrid();
        }

        document.getElementById('board').addEventListener('click', (e) => {
            if(isGameOver || !isPlayerTurn) return;
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const c = Math.round((x - 15) / cellSize);
            const r = Math.round((y - 15) / cellSize);
            
            if(r>=0 && r<size && c>=0 && c<size && board[r][c] === 0) {
                placePiece(r, c, 1);
                if(checkWin(r, c, 1)) {
                    endGame('玩家赢了！🎉');
                } else {
                    isPlayerTurn = false;
                    document.getElementById('status').textContent = 'AI 思考中...';
                    setTimeout(aiMove, 300);
                }
            }
        });

        function placePiece(r, c, player) {
            board[r][c] = player;
            const piece = document.createElement('div');
            piece.className = 'cell ' + (player === 1 ? 'black' : 'white');
            piece.style.left = (15 + c * cellSize) + 'px';
            piece.style.top = (15 + r * cellSize) + 'px';
            document.getElementById('pieces').appendChild(piece);
        }

        function checkWin(r, c, player) {
            const dirs = [[1,0], [0,1], [1,1], [1,-1]];
            for(let [dr, dc] of dirs) {
                let count = 1;
                for(let i=1; i<=4; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if(nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc] === player) count++; else break;
                }
                for(let i=1; i<=4; i++) {
                    let nr = r - dr*i, nc = c - dc*i;
                    if(nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc] === player) count++; else break;
                }
                if(count >= 5) return true;
            }
            return false;
        }

        function endGame(msg) {
            isGameOver = true;
            document.getElementById('status').textContent = msg;
            setTimeout(()=>alert(msg), 100);
        }

        // 极简贪心AI
        function aiMove() {
            if(isGameOver) return;
            let bestScore = -1, bestMoves = [];
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    if(board[r][c] === 0) {
                        let score = evaluate(r, c, 2) * 1.1 + evaluate(r, c, 1); // 略微偏向进攻
                        if(score > bestScore) {
                            bestScore = score;
                            bestMoves = [[r, c]];
                        } else if(score === bestScore) {
                            bestMoves.push([r, c]);
                        }
                    }
                }
            }
            if(bestMoves.length > 0) {
                const [r, c] = bestMoves[Math.floor(Math.random()*bestMoves.length)];
                placePiece(r, c, 2);
                if(checkWin(r, c, 2)) {
                    endGame('AI 赢了！🤖');
                } else {
                    isPlayerTurn = true;
                    document.getElementById('status').textContent = '玩家 (黑) 回合';
                }
            }
        }

        function evaluate(r, c, player) {
            let total = 0;
            const dirs = [[1,0], [0,1], [1,1], [1,-1]];
            for(let [dr, dc] of dirs) {
                let count = 1, block = 0;
                for(let i=1; i<=4; i++) {
                    let nr = r + dr*i, nc = c + dc*i;
                    if(nr<0 || nr>=size || nc<0 || nc>=size || board[nr][nc] === (3-player)) { block++; break; }
                    if(board[nr][nc] === player) count++; else break;
                }
                for(let i=1; i<=4; i++) {
                    let nr = r - dr*i, nc = c - dc*i;
                    if(nr<0 || nr>=size || nc<0 || nc>=size || board[nr][nc] === (3-player)) { block++; break; }
                    if(board[nr][nc] === player) count++; else break;
                }
                if(block === 2 && count < 5) continue;
                if(count >= 5) return 100000;
                if(count === 4 && block === 0) total += 10000;
                if(count === 4 && block === 1) total += 1000;
                if(count === 3 && block === 0) total += 1000;
                if(count === 3 && block === 1) total += 100;
                if(count === 2 && block === 0) total += 100;
            }
            return total;
        }

        init();
    </script>
</body>
</html>
